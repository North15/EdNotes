name: release-packages
on:
  push:
    tags:
      - 'v*'

jobs:
  build-test-pack-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version
        id: ver
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node - <<'EOF'
          const fs = require('fs');

          const releaseRef = process.env.RELEASE_REF;
          if (!releaseRef || !releaseRef.startsWith('v')) {
            console.error(`Release ref must start with v. Got: ${releaseRef || '<empty>'}`);
            process.exit(1);
          }

          const version = releaseRef.slice(1);
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const csproj = fs.readFileSync('src/EdNotes.RichText/EdNotes.RichText.csproj', 'utf8');
          const packageIdMatch = csproj.match(/<PackageId>([^<]+)<\/PackageId>/);
          const versionMatch = csproj.match(/<Version>([^<]+)<\/Version>/);

          if (!packageIdMatch || !versionMatch) {
            console.error('Could not find <PackageId> and <Version> in src/EdNotes.RichText/EdNotes.RichText.csproj');
            process.exit(1);
          }

          const packageVersion = String(packageJson.version || '').trim();
          const packageName = String(packageJson.name || '').trim();
          const csprojVersion = versionMatch[1].trim();
          const packageId = packageIdMatch[1].trim();

          if (packageVersion !== version) {
            console.error(`Tag version ${version} does not match package.json version ${packageVersion}`);
            process.exit(1);
          }

          if (csprojVersion !== version) {
            console.error(`Tag version ${version} does not match csproj version ${csprojVersion}`);
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `version=${version}`,
              `npm_package_name=${packageName}`,
              `nuget_package_id=${packageId}`
            ].join('\n') + '\n'
          );
          EOF
      - name: Restore
        run: dotnet restore EdNotes.sln
      - name: Install JS deps
        run: npm ci
      - name: Lint JS
        run: npm run lint
      - name: JS Tests
        run: node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config package.json --runInBand --coverage
      - name: Build
        run: dotnet build EdNotes.sln -c Release --no-restore
      - name: .NET Tests
        run: dotnet test tests/unit/EdNotes.RichText.Tests.csproj -c Release --no-build
      - name: Pack
        run: dotnet pack src/EdNotes.RichText/EdNotes.RichText.csproj -c Release -p:PackageVersion=${{ steps.ver.outputs.version }} -o ./artifacts
      - name: Publish (npm)
        if: success()
        env:
          NPM_PACKAGE_NAME: ${{ steps.ver.outputs.npm_package_name }}
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node - <<'EOF'
          const packageName = process.env.NPM_PACKAGE_NAME;
          const version = process.env.PACKAGE_VERSION;

          const { spawnSync } = require('child_process');
          const published = spawnSync('npm', ['view', `${packageName}@${version}`, 'version'], {
            encoding: 'utf8',
            shell: true
          });

          if (published.status === 0 && published.stdout.trim() === version) {
            console.log(`npm package ${packageName}@${version} already published; skipping.`);
            process.exit(0);
          }

          const result = spawnSync('npm', ['publish', '--ignore-scripts', '--provenance'], {
            stdio: 'inherit',
            shell: true
          });

          if (result.status !== 0) {
            console.error('npm publish failed. Configure npm trusted publishing for this repository in the npm package settings.');
          }

          process.exit(result.status ?? 1);
          EOF
      - name: Publish (NuGet)
        if: success()
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          node - <<'EOF'
          const k=process.env.NUGET_API_KEY;
          if(!k){ console.log('NUGET_API_KEY secret not set; skipping publish.'); process.exit(0);} 
          const {spawnSync}=require('child_process');
          const r = spawnSync('dotnet',['nuget','push','artifacts/*.nupkg','--api-key',k,'--source','https://api.nuget.org/v3/index.json','--skip-duplicate'],{stdio:'inherit',shell:true});
          process.exit(r.status);
          EOF
